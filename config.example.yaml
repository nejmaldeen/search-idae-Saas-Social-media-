# Example configuration. Copy to config.yaml and fill in.
# NEVER commit real secrets. All credentials are read from the ENVIRONMENT,
# not from this file - this file documents which variables each source needs.

database: ./data/oda.sqlite3

project:
  name: "AI SaaS opportunities - Saudi ecommerce"
  domain: "ecommerce inventory and order management"
  market: sa              # sa | ae | eg  (adds local phrasing to queries)
  languages: [ar, en]
  sector: ecommerce       # synonym pack: ecommerce | saas
  period_days: 365

collection:
  per_query_limit: 25
  max_queries_per_platform: 8
  sleep_between_queries: 7.0     # respect provider rate limits
  known_tools: [Shopify, Salla, Zid, Zoho Inventory, Cin7]

extraction:
  min_signal_clarity: 0.45       # signals below this are not stored
  require_domain_term: true      # a signal must mention the domain to be kept

# ---------------------------------------------------------------------------
# Credentials - set these as environment variables, not here.
#
#   GITHUB_API_TOKEN          optional; raises the search rate limit 10->30/min
#   STACKEXCHANGE_KEY         optional; raises the daily quota 300->10,000
#   REDDIT_CLIENT_ID          required for Reddit; register a "script" app at
#   REDDIT_CLIENT_SECRET      https://www.reddit.com/prefs/apps
#   YOUTUBE_API_KEY           required for YouTube Data API v3
#   TIKTOK_CLIENT_KEY         TikTok Research API (application + approval)
#   TIKTOK_CLIENT_SECRET
#   IG_ACCESS_TOKEN           Instagram Graph API (Business acct + app review)
#   IG_BUSINESS_ACCOUNT_ID
#   X_BEARER_TOKEN            X API v2, paid tier (free tier has no search)
#
# G2 and Capterra have no public read API and their terms disallow automated
# collection. They are reachable only through the Manual Import path.
# ---------------------------------------------------------------------------
